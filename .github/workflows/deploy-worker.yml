name: Deploy Worker

on:
  push:
    branches: [main]
    # Everything the Worker bundles: calendar.js imports calc.js for the route
    # estimates, so a change to either changes what is deployed.
    paths:
      - worker.js
      - calendar.js
      - garmin.js
      - calc.js
      - wrangler.toml

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
