name            = "activities-api"
main            = "worker.js"
compatibility_date = "2024-01-01"
account_id      = "ff7d99e86c89fefa648b7c06f5447f81"
# Leave any variable set in the Cloudflare dashboard alone on deploy; [vars] below
# adds to them rather than replacing them.
keep_vars = true

# This connects your code's "env.CACHE" to an actual KV bucket
[[kv_namespaces]]
binding = "CACHE"
id      = "1d4eb3dfbeeb4e7a90468052225dcfec"

# Add this line to unlock out-of-the-box AI
[ai]
binding = "AI"

# Every three hours (00:00, 03:00 … 21:00 UTC): the Strava → Notion Training Log
# sync, then an activities refresh. The 09:00, 15:00 and 21:00 runs pull the whole
# history and backfill segment PBs; the others ask Strava for the last week and
# merge it in (FULL_PULL_HOURS_UTC in worker.js). So the cache, and the CV
# repo's daily snapshot that reads it, is never more than three hours behind.
# Cloudflare cron is UTC-only; with a run every three hours, daylight saving
# no longer needs the hours shifting by hand.
# The weekly email (weekly.js), every Tuesday from 07:00 London for the Monday to
# Sunday before. WEEKLY_FROM must be an address the Fastmail token may send as;
# WEEKLY_TO is comma-separated. FASTMAIL_TOKEN is a secret, never in this file:
#   npx wrangler secret put FASTMAIL_TOKEN
# (Fastmail -> Settings -> Privacy & Security -> API tokens, Mail scope, read and write.)
[vars]
WEEKLY_FROM = "hello@laurencekellett.co.uk"
WEEKLY_TO   = "hello@laurencekellett.co.uk"

[triggers]
# The second is the Google Calendar reconcile (calendar.js): planned Zwift rides
# both ways, so a drag in the calendar reaches Notion within 15 minutes. It does
# nothing else, and nothing at all until the GOOGLE_* secrets are set.
# The third reads the owner's daily Garmin numbers (garmin.js); nothing until the
# GARMIN_API secret is set.
crons = ["0 */3 * * *", "*/15 * * * *", "20 */3 * * *"]
