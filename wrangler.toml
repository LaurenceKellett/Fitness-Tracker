name            = "activities-api"
main            = "worker.js"
compatibility_date = "2024-01-01"
account_id      = "ff7d99e86c89fefa648b7c06f5447f81"

# This connects your code's "env.CACHE" to an actual KV bucket
[[kv_namespaces]]
binding = "CACHE"
id      = "1d4eb3dfbeeb4e7a90468052225dcfec"

# Fires every hour; the Worker decides which firings do the work.
#
# This used to be three hard-coded UTC hours chosen to look like 10am, 4pm and 11pm
# in British Summer Time — and Cloudflare cron is UTC-only and does not shift for
# daylight saving, so from late October to late March the feed landed an hour early
# and the file said so: "or just accept the feed landing an hour off for a few
# weeks." A schedule that is wrong for five months of the year is not a schedule.
#
# Hourly costs nothing (the Worker returns immediately on the other 21 firings) and
# a Worker CAN read the UK local hour, which a cron expression cannot. See
# shouldRunScheduledWork() in worker.js.
[triggers]
crons = ["0 * * * *"]
