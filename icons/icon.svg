<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Signal": an ink tile and one square of accent — the way the dashboard itself
       uses colour, nothing but the signal. Follows the system theme: paper with a
       hairline in light, ink in dark; the accent square is the constant. -->
  <style>
    .tile{fill:#f7f7f7}.frame{fill:none;stroke:#dddddd;stroke-width:24}
    @media (prefers-color-scheme:dark){.tile{fill:#121214}.frame{stroke:#3a3a40}}
  </style>
  <rect class="tile" width="512" height="512"/>
  <rect class="frame" x="12" y="12" width="488" height="488"/>
  <rect x="287" y="287" width="143" height="143" fill="#ff385c"/>
</svg>
